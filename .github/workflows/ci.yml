name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # numpy==2.4.6 / pandas==3.0.3 / scikit-learn==1.9.0 / matplotlib==3.11.0
        # (pinned in requirements.txt) all publish requires-python >=3.11 on PyPI,
        # so Python 3.10 is not usable here even though pyproject.toml declares
        # requires-python = ">=3.10". Using 3.11/3.12 instead of the originally
        # requested 3.10/3.12 matrix.
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU-only PyTorch
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install remaining dependencies
        run: pip install -r requirements.txt

      - name: Install package
        run: pip install -e .

      - name: Run test suite
        run: python -m pytest tests -q
